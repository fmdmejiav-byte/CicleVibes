; ===== CicleVibes - Configuración PHP para producción =====
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 120
max_input_vars = 5000

; Zona horaria (los valores de Laravel se gestionan por config/app.php, pero
; esta es una red de seguridad a nivel de PHP).
date.timezone = UTC

; Opcache: recomendado en producción.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 0
